workflows:
  ios-test-sign:
    name: Minimal iOS Sign & Upload

    environment:
      vars:
        XCODE_SCHEME: "shield-connect"
        XCODE_PROJECT: "shield-connect.xcodeproj"
        BUNDLE_ID: "com.synaxis.shieldconnect"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.synaxis.shieldconnect

    scripts:
      - name: Set up code signing in project
        script: xcode-project use-profiles

      - name: Clean and archive project
        script: |
          xcodebuild clean
          set -o pipefail && xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$HOME/build/$XCODE_SCHEME.xcarchive" \
            -allowProvisioningUpdates \
          | tee "$CM_BUILD_DIR/xcodebuild.log"

      - name: Export .ipa for App Store
        script: |
          xcodebuild -exportArchive \
            -archivePath "$HOME/build/$XCODE_SCHEME.xcarchive" \
            -exportPath "$HOME/build/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
          | tee "$CM_BUILD_DIR/export.log"

    artifacts:
      - $CM_BUILD_DIR/xcodebuild.log
      - $CM_BUILD_DIR/export.log
      - build/export/*.ipa
      - build/**/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
