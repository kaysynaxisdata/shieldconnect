workflows:
  ios-test-sign:
    name: Minimal iOS Sign & Upload

    integrations:
      app_store_connect: "CodeMagic"

    environment:
      vars:
        XCODE_SCHEME: "shield-connect"
        XCODE_PROJECT: "shield-connect.xcodeproj"
        BUNDLE_ID: "com.synaxis.shieldconnect"

      ios_signing:
        provisioning_profiles:
          - AppstoreShield
        certificates:
          - AppCertificate

    scripts:
      - name: Set up code signing in project
        script: xcode-project use-profiles

      - name: Clean and archive project
        script: |
          xcodebuild clean
          set -o pipefail && xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$HOME/build/$XCODE_SCHEME.xcarchive" \
            -allowProvisioningUpdates \
          | tee "$CM_BUILD_DIR/xcodebuild.log"

      - name: Export .ipa using default settings
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-dir "$HOME/build/ipa" \
          | tee "$CM_BUILD_DIR/export.log"

      - name: Debug IPA contents
        script: |
          echo "IPA directory listing:" 
          find $HOME -name "*.ipa"

    artifacts:
      - $CM_BUILD_DIR/xcodebuild.log
      - $CM_BUILD_DIR/export.log
      - build/ipa/*.ipa
      - build/**/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
