workflows:
  ios-test-sign:
    name: Minimal iOS Sign & Archive
    environment:
      vars:
        XCODE_SCHEME: "shield-connect"
        XCODE_PROJECT: "shield-connect.xcodeproj"
        BUNDLE_ID: "com.synaxis.shieldconnect"

    code_signing:
      certificates:
        - certificate_url: AppCertificate
      provisioning_profiles:
        - bundle_identifier: $BUNDLE_ID
          profile_url: AppstoreShield

    scripts:
      - name: Clean and archive project
        script: |
          xcodebuild clean
          set -o pipefail && xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$HOME/build/$XCODE_SCHEME.xcarchive" \
            -allowProvisioningUpdates \
          | tee "$CM_BUILD_DIR/xcodebuild.log"

    artifacts:
      - $CM_BUILD_DIR/xcodebuild.log
      - build/**/*.xcarchive
